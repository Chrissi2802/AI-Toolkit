[project]
name = "AI-Toolkit"
version = "0.1"
description = "Comprehensive toolkit for AI."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python", "machine-learning", "ai", "toolkit", "sklearn", "regression", "supervised-learning", "classification"]
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [{name = "Chrissi"}]

[project.urls]
Repository = "https://github.com/Chrissi2802/AI-Toolkit.git"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = {file = ["requirements-dev.txt"]}

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
indent = "    "
known_first_party = ["ai_toolkit"]
lines_after_imports = 2
skip = [
    ".git",
    "v_env",
    "__pycache__",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20"
]
addopts = "-v --cov=ai_toolkit --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
