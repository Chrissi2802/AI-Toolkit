[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings = 
    ignore::pydantic.warnings.PydanticDeprecatedSince20
addopts = -v --cov=ai_toolkit --cov-report=term-missing
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
